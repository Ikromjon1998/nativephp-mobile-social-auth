name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.3.11 and 4.6.1 are the first releases with DispatchableFromNative
          # (GHSA-83jv-8h7x-287p); nothing older satisfies composer.json. Two
          # prefer-lowest jobs test those floors; the others test the newest
          # 3.3.x, 4.7.x and 4.8.x (3.3.12 and 4.8 added signed native events).
          # main's ruleset requires checks named exactly "PHP 8.3" and
          # "PHP 8.4", so the prefer-stable jobs on the newest 3.x and 4.x keep
          # those names.
          - name: PHP 8.3 - nativephp/mobile 3.3.11 - prefer-lowest
            php: '8.3'
            mobile: '3.3.11'
            stability: prefer-lowest
          - name: PHP 8.3
            php: '8.3'
            mobile: '3.3.*'
            stability: prefer-stable
          - name: PHP 8.3 - nativephp/mobile 4.6.1 - prefer-lowest
            php: '8.3'
            mobile: '4.6.1'
            stability: prefer-lowest
          - name: PHP 8.4 - nativephp/mobile 4.7.x
            php: '8.4'
            mobile: '4.7.*'
            stability: prefer-stable
          - name: PHP 8.4 - nativephp/mobile 4.8.x - prefer-lowest
            php: '8.4'
            mobile: '4.8.*'
            stability: prefer-lowest
          - name: PHP 8.4
            php: '8.4'
            mobile: '4.8.*'
            stability: prefer-stable
            quality: true

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.mobile }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.mobile }}-${{ matrix.stability }}-

      # Pins the core with --with so composer.json keeps its real constraint.
      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --with "nativephp/mobile:${{ matrix.mobile }}" --prefer-dist --no-interaction --no-progress

      - name: Resolved versions
        run: composer show | grep -E '^(nativephp/mobile|laravel/framework|orchestra/testbench|pestphp/pest|phpunit/phpunit|larastan/larastan) '

      - name: Lint (Pint)
        if: matrix.quality
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        if: matrix.quality
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests (Pest)
        run: vendor/bin/pest
